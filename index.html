<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>旅遊行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFCF6;--ink:#3E3A39;--coral:#F2A497;--yellow:#F6D27A;--aqua:#A8D3E6;--green:#B9DAA5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:'Huninn',-apple-system,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;padding:20px 16px}
.card{width:100%;max-width:380px;border:3px solid var(--ink);border-radius:32px;box-shadow:4px 4px 0 var(--ink);background:var(--paper);overflow:hidden;text-align:center}
.card svg{display:block;width:100%;height:auto;border-bottom:3px solid var(--ink);background:var(--aqua)}
.in{padding:18px 20px 24px}
h1{font-size:24px;font-weight:400;margin:0 0 4px;line-height:1.3}
p{margin:0 0 14px;font-size:15px}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:18px;padding:8px 16px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);color:var(--ink);text-align:center;outline:none}
input:focus-visible{box-shadow:0 0 0 3px var(--yellow)}
button{margin-top:14px;font:inherit;font-size:17px;color:var(--ink);background:var(--coral);border:3px solid var(--ink);border-radius:999px;padding:4px 28px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .15s,box-shadow .15s}
button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
button[disabled]{opacity:.6;cursor:wait}
.rm{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:14px;cursor:pointer}
.rm input{width:18px;height:18px;accent-color:#3E3A39}
.err{min-height:1.6em;margin:10px 0 0;font-size:15px;color:#B3463A}
.bob{animation:bob 4s ease-in-out infinite}
.sh{animation:shake .4s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <svg viewBox="0 0 320 130" role="img" aria-label="上鎖的行李箱插圖">
    <circle cx="262" cy="30" r="18" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/>
    <g class="bob">
      <path d="M124 54 V40 a10 10 0 0 1 10 -10 h52 a10 10 0 0 1 10 10 V54" fill="none" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/>
      <rect x="82" y="54" width="156" height="66" rx="14" fill="#F2A497" stroke="#3E3A39" stroke-width="3"/>
      <rect x="82" y="80" width="156" height="8" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/>
      <rect x="146" y="72" width="28" height="24" rx="6" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3"/>
      <circle cx="160" cy="84" r="3.5" fill="#3E3A39"/>
    </g>
    <path d="M24 108 q8 -12 16 0 M278 106 q8 -12 16 0" fill="none" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <div class="in">
    <h1>行程已上鎖</h1>
    <p>請輸入密碼後查看</p>
    <input id="pw" type="password" placeholder="密碼" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="密碼" autofocus>
    <label class="rm"><input type="checkbox" id="rm"> 在這個裝置記住密碼</label>
    <button id="go" type="submit">解鎖</button>
    <div class="err" id="err" role="alert"></div>
  </div>
</form>

var LS='trip-lock-pw';
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function get(){try{return localStorage.getItem(LS)}catch(e){return null}}
function set(v){try{if(v==null)localStorage.removeItem(LS);else localStorage.setItem(LS,v)}catch(e){}}
var f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),go=document.getElementById('go'),rm=document.getElementById('rm');
async function unlock(pass){
  if(!window.crypto||!crypto.subtle) throw new Error('nocrypto');
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.d));
  return new TextDecoder().decode(buf);
}
async function attempt(pass,auto){
  go.disabled=true;err.textContent=auto?'':'解鎖中…';
  try{
    var html=await unlock(pass);
    if(rm.checked&&!auto)set(pass);
    document.open();document.write(html);document.close();
  }catch(e){
    go.disabled=false;
    if(e&&e.message==='nocrypto'){err.textContent='此瀏覽器環境不支援解密，請改用 https 網址或較新的瀏覽器。';return;}
    if(auto){set(null);err.textContent='';return;}
    err.textContent='密碼不正確，再試一次';
    f.classList.remove('sh');void f.offsetWidth;f.classList.add('sh');
    pw.select();
  }
}
f.addEventListener('submit',function(e){e.preventDefault();if(pw.value)attempt(pw.value,false);});
var saved=get();if(saved){rm.checked=true;attempt(saved,true);}
